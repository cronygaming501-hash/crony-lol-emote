    <!-- Live Counter Script -->
    <script>
        let baseMembers = 48215;
        let baseDownloads = 425910;

        function updateCounters() {
            let memberDiff = Math.floor(Math.random() * 21) - 8;
            baseMembers += memberDiff;

            if (Math.random() > 0.4) {
                baseDownloads += Math.floor(Math.random() * 3) + 1;
            }

            document.getElementById('live-members').innerText = baseMembers.toLocaleString();
            document.getElementById('total-downloads').innerText = baseDownloads.toLocaleString() + '+';
        }

        setInterval(updateCounters, 2500);
    </script>
